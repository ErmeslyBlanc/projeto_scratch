<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato - Scratch na Escola</title>

  <!-- Tipografia + tema -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/contato.css" />

</head>
<body>
  <!-- Fundo decorativo (sem ambient-dots aqui) -->
  <div class="bg-blob b1" aria-hidden="true"></div>
  <div class="bg-blob b2" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div id="bg-art" aria-hidden="true"></div>

  <!-- Navbar padrão -->
  <header class="nav-wrap">
    <nav class="nav container" aria-label="principal">
      <a class="brand" href="index.html">
        <img src="./img/logo-scratch.png" alt="Logo Scratch" class="logo-scratch" />
        <span class="logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z" stroke="#0b1220" stroke-width="2"/>
          </svg>
        </span>
        <strong>Explorando o mundo da Tecnologia com Scratch</strong>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <ul class="nav-list" id="nav-list">
        <li><a href="./index.html">Início</a></li>
        <li><a href="./sobre.html">Sobre</a></li>
        <li><a href="./metodologia.html">Metodologia</a></li>
        <li><a href="./equipe.html">Equipe</a></li>
        <li><a class="active" href="./contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero compacto -->
  <section class="container section" style="padding-top:18px;">
    <div class="hero" style="grid-template-columns:1fr; text-align:center; justify-items:center;">
      <h1 class="title" style="margin:6px 0 0;">Entre em <span>Contato</span></h1>
      <p class="subtitle" style="max-width:70ch;">
        Dúvidas, sugestões, parceria ou encontrou um bug? Fale com a gente - respondemos rapidinho. ✉️
      </p>
    </div>
  </section>

  <!-- Card com formulário -->
  <section class="container" style="margin-top:12px;">
    <article class="card reveal card-wide">
      <h2 style="margin:0 0 10px;">Mande sua mensagem</h2>
      <form action="processar_contato.php" method="POST" style="display:grid; gap:12px;">

        <div class="form-group">
          <label for="nome">Seu nome</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required
            style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--stroke); background:#0f1a2f; color:#e6ecff;"/>
        </div>

        <div class="form-group">
          <label for="email">Seu e-mail</label>
          <input type="email" id="email" name="email" placeholder="exemplo@email.com" required
            style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--stroke); background:#0f1a2f; color:#e6ecff;"/>
        </div>

        <div class="form-group">
          <label for="assunto">Assunto</label>
          <input type="text" id="assunto" name="assunto" placeholder="Sobre o que você quer falar?" required
            style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--stroke); background:#0f1a2f; color:#e6ecff;"/>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..." required
            style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--stroke); background:#0f1a2f; color:#e6ecff; resize:vertical;"></textarea>
        </div>

        <div style="display:flex; gap:8px; justify-content:flex-start; margin-top:6px;">
          <button type="submit" class="btn">Enviar mensagem</button>
          <button type="reset" class="btn ghost">Limpar</button>
        </div>
      </form>
    </article>
  </section>

  <footer class="foot" role="contentinfo">
    <p>&copy; Projeto de Extensão • Scratch na Escola</p>
  </footer>

  <!-- JS comum (menu/reveal etc.) -->
  <script src="js/main.js" defer></script>
</body>
</html>
